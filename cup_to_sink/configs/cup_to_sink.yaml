task:
  name: cup_to_sink
  instruction: "put the cup into the sink"
  num_success: 50
  max_attempts: 500

scene:
  lab_usd_path: "usd/kitchen/kitchen.usd"
  cup_usd_path: "usd/other/Cup.usd"
  cup_prim_path: "/World/Objects/Cup"
  sink_target_prim_path: "/World/Kitchen/Sink/PlacePoint"

  # ── Calibrated 2026-06-29 via cup_to_sink/inspect_scene.py ──────────────────
  # sink_area AABB (world space, meters):
  #   min=(1.2750, -0.7300, 0.0000)  max=(1.8550, 1.3300, 0.8500)
  # Basin region inferred at Y ∈ [-0.730, -0.050] — the Y band before the
  # dishwasher (Y=-0.050 to 0.450) and left drawers (Y=0.503 to 1.297).
  # sink_area_surface/visuals had an unresolved reference (kitchen_physics.usd
  # not linked), so no separate basin prim AABB was available; basin bounds are
  # structurally inferred from surrounding prims.
  # Counter top Z = 0.850 m.  Basin interior estimated ≈ 0.70 m (15 cm recess).
  #
  # Format: [x, y, z, qw, qx, qy, qz]  (world frame, meters / unit quat)
  sink_target_pose_world: [1.565, -0.390, 0.700, 1.0, 0.0, 0.0, 0.0]

  # Cup spawn base XY: center of basin on counter top surface.
  # randomization.cup_xlim/ylim are added as offsets to this point.
  cup_spawn_base_xy: [1.565, -0.390]

  # Fixed cup spawn position used for env_builder (smoke test, single-episode
  # builds).  Placed midway between Franka base (X=1.325) and basin centre
  # (X=1.565), aligned on Y with both.  Well within Franka's ~0.85 m reach.
  # Z is the counter-top surface; env_builder adjusts for the cup's bbox.
  cup_spawn_position: [1.50, -0.390, 0.850]

  # Z height of the counter top surface (cup sits here before pickup).
  counter_top_z: 0.850

robot:
  name: franka_panda
  prim_path: "/World/Franka"
  # Calibrated base position: front edge of sink counter, counter-top height,
  # Y-aligned with basin centre.  Counter front face X=1.275; base placed 5 cm
  # inside (X=1.325) so it sits on the counter surface.  Z=0.850 = counter top.
  # Franka reach ≈ 0.85 m.  Distances from here:
  #   → sink target (1.565, -0.390, 0.700): ~0.28 m  ✓
  #   → nearest cup (1.565±0.10, -0.390±0.15, 0.850): max ~0.37 m  ✓
  base_position: [1.325, -0.390, 0.850]
  base_quat: [1.0, 0.0, 0.0, 0.0]
  ee_frame: "panda_hand"
  arm_joint_names:
    - panda_joint1
    - panda_joint2
    - panda_joint3
    - panda_joint4
    - panda_joint5
    - panda_joint6
    - panda_joint7
  gripper_joint_names:
    - panda_finger_joint1
    - panda_finger_joint2
  finger_joint_open: 0.04
  finger_joint_closed: 0.0
  gripper_open_width: 0.08
  gripper_closed_width: 0.0
  policy_gripper_action: "width"
  curobo_robot_cfg: "/path/to/franka.yml"

randomization:
  seed: ${episode_seed}
  # Cup spawn offsets from scene.cup_spawn_base_xy = (1.565, -0.390).
  # These keep the cup on the counter surface around the basin rim:
  #   X ∈ [1.465, 1.665]  (within counter X range 1.275–1.855)
  #   Y ∈ [-0.540, -0.240] (within basin Y range -0.730 to -0.050)
  # All spawned positions are within 0.37 m of the Franka base → well in reach.
  cup_xlim: [-0.10, 0.10]
  cup_ylim: [-0.15, 0.15]
  cup_yaw_range: [-3.14, 3.14]
  cup_z_offset_range: [0.0, 0.0]
  sink_target_sample_xy: true
  sink_target_xlim: [-0.02, 0.02]
  sink_target_ylim: [-0.02, 0.02]
  robot_initial_qpos_mode: "default"
  robot_default_qpos: [0.0, -0.4, 0.0, -2.2, 0.0, 2.0, 0.8]
  settle_steps: 100
  camera_pose_jitter: false
  camera_position_noise: 0.0
  camera_rotation_noise_deg: 0.0
  lighting_jitter: false

grasp:
  contact_point_selection: "best_feasible"  # "fixed", "seed_random", "best_feasible", "seed_random_feasible"
  fixed_contact_point_id: 0
  candidate_contact_point_ids: [0]
  record_selected_contact_point: true

cup:
  contact_points:
    - name: side_grasp
      position_obj: [0.045, 0.0, 0.08]
      quat_obj: [1.0, 0.0, 0.0, 0.0]
      pregrasp_distance: 0.10
  functional_points:
    - name: cup_center
      position_obj: [0.0, 0.0, 0.0]
      quat_obj: [1.0, 0.0, 0.0, 0.0]

motion:
  lift_height: 0.10
  preplace_distance: 0.06
  retreat_height: 0.08
  gripper_steps: 200

success:
  xy_threshold: 0.06
  z_min_offset: -0.03
  z_max_offset: 0.15

dataset:
  output_dir: "datasets/cup_to_sink"
  enabled_cameras: ["front", "left", "right", "wrist"]
  save_rgb: true
  save_depth: true
  image_width: 256
  image_height: 256
  depth_format: "uint16_mm"
  compression: "gzip"

cameras:
  front:
    prim_path: "/World/Cameras/front"
    position: [0.0, -1.5, 1.2]
    quat: [1.0, 0.0, 0.0, 0.0]
    width: 256
    height: 256
    fov: 60.0
    save_rgb: true
    save_depth: true
  left:
    prim_path: "/World/Cameras/left"
    position: [-1.2, 0.0, 1.1]
    quat: [1.0, 0.0, 0.0, 0.0]
    width: 256
    height: 256
    fov: 60.0
    save_rgb: true
    save_depth: true
  right:
    prim_path: "/World/Cameras/right"
    position: [1.2, 0.0, 1.1]
    quat: [1.0, 0.0, 0.0, 0.0]
    width: 256
    height: 256
    fov: 60.0
    save_rgb: true
    save_depth: true
  wrist:
    prim_path: "/World/Franka/panda_hand/wrist_camera"
    parent_prim_path: "/World/Franka/panda_hand"
    position: [0.0, 0.0, 0.05]
    quat: [1.0, 0.0, 0.0, 0.0]
    width: 256
    height: 256
    fov: 70.0
    save_rgb: true
    save_depth: true
