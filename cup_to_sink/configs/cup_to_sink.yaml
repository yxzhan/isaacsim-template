task:
  name: cup_to_sink
  instruction: "put the cup into the sink"
  num_success: 50
  max_attempts: 500

scene:
  lab_usd_path: "usd/kitchen/kitchen.usd"
  cup_usd_path: "usd/other/Cup.usd"
  cup_prim_path: "/World/Objects/Cup"
  sink_target_prim_path: "/World/Kitchen/Sink/PlacePoint"

  # -- Calibrated 2026-06-29 via cup_to_sink/inspect_scene.py ------------------
  # sink_area AABB (world space, meters):
  #   min=(1.2750, -0.7300, 0.0000)  max=(1.8550, 1.3300, 0.8500)
  # Basin region inferred at Y in [-0.730, -0.050] - the Y band before the
  # dishwasher (Y=-0.050 to 0.450) and left drawers (Y=0.503 to 1.297).
  # sink_area_surface/visuals had an unresolved reference (kitchen_physics.usd
  # not linked), so no separate basin prim AABB was available; basin bounds are
  # structurally inferred from surrounding prims.
  # Counter top Z = 0.850 m.  EMPIRICAL FINDING (collect runs): this kitchen
  # asset has NO physical basin recess at the sink location - a placed cup rests
  # on the counter surface (rigid-body origin settles ~0.89 m). Targeting z=0.70
  # drove the (offset-corrected) gripper place pose below the counter, which is
  # unreachable, so the cup never arrived. We therefore set the sink target z to
  # the counter-surface level; "put the cup into the sink" is realised as
  # delivering the cup to the sink XY region on the counter, gripper released.
  #
  # Format: [x, y, z, qw, qx, qy, qz]  (world frame, meters / unit quat)
  sink_target_pose_world: [1.565, -0.390, 0.860, 1.0, 0.0, 0.0, 0.0]

  # Cup spawn base XY: center of basin on counter top surface.
  # randomization.cup_xlim/ylim are added as offsets to this point.
  cup_spawn_base_xy: [1.565, -0.390]

  # Fixed cup spawn position used for env_builder (smoke test, single-episode
  # builds).  Placed at X=1.555 which sits in the reliably-reachable window
  # (X~1.55-1.575) between the Franka base (X=1.325) and the basin centre
  # (X=1.565).  A top-down target at X=1.50 hit a kinematic dead zone in
  # testing; X=1.555 is empirically stable.
  # Z is the counter-top surface; env_builder adjusts for the cup's bbox.
  cup_spawn_position: [1.555, -0.390, 0.850]

  # Z height of the counter top surface (cup sits here before pickup).
  counter_top_z: 0.850

robot:
  name: franka_panda
  prim_path: "/World/Franka"
  # Calibrated base position: front edge of sink counter, counter-top height,
  # Y-aligned with basin centre.  Counter front face X=1.275; base placed 5 cm
  # inside (X=1.325) so it sits on the counter surface.  Z=0.850 = counter top.
  # Franka reach ~ 0.85 m.  Distances from here:
  #   -> sink target (1.565, -0.390, 0.700): ~0.28 m  ok
  #   -> nearest cup (1.565+/-0.10, -0.390+/-0.15, 0.850): max ~0.37 m  ok
  base_position: [1.325, -0.390, 0.850]
  base_quat: [1.0, 0.0, 0.0, 0.0]
  ee_frame: "panda_hand"
  arm_joint_names:
    - panda_joint1
    - panda_joint2
    - panda_joint3
    - panda_joint4
    - panda_joint5
    - panda_joint6
    - panda_joint7
  gripper_joint_names:
    - panda_finger_joint1
    - panda_finger_joint2
  finger_joint_open: 0.04
  finger_joint_closed: 0.0
  gripper_open_width: 0.08
  gripper_closed_width: 0.0
  policy_gripper_action: "width"
  curobo_robot_cfg: "/path/to/franka.yml"

randomization:
  seed: ${episode_seed}
  # Cup spawn offsets from scene.cup_spawn_position[:2] = (1.555, -0.390).
  # Tightened to +/-0.02 m for initial collection so every seed spawns in the
  # confirmed-reachable window (X in [1.535, 1.575], Y in [-0.410, -0.370]).
  # Widen to +/-0.05-0.10 after a working grasp pose is confirmed.
  cup_xlim: [-0.02, 0.02]
  cup_ylim: [-0.02, 0.02]
  cup_yaw_range: [-3.14, 3.14]
  cup_z_offset_range: [0.0, 0.0]
  sink_target_sample_xy: true
  sink_target_xlim: [-0.02, 0.02]
  sink_target_ylim: [-0.02, 0.02]
  robot_initial_qpos_mode: "default"
  robot_default_qpos: [0.0, -0.4, 0.0, -2.2, 0.0, 2.0, 0.8]
  settle_steps: 100
  camera_pose_jitter: false
  camera_position_noise: 0.0
  camera_rotation_noise_deg: 0.0
  lighting_jitter: false

grasp:
  contact_point_selection: "best_feasible"  # "fixed", "seed_random", "best_feasible", "seed_random_feasible"
  fixed_contact_point_id: 0
  candidate_contact_point_ids: [0]
  record_selected_contact_point: true
  # If true, after the gripper closes a USD FixedJoint is created between
  # panda_hand and the cup rigid body so the cup is rigidly carried during the
  # lift/place phases, then removed before the gripper-open action.
  # Set true only if friction alone cannot hold the cup during the lift.
  use_attach: true
  # When use_attach is on, snap the cup to a clean pose directly under the
  # gripper TCP just before welding, so the carry transform is deterministic
  # (the descent can knock a free cup sideways). Expert-generator convenience;
  # flagged in HDF5 meta as grasp_snap_used.
  snap_to_gripper: true

cup:
  contact_points:
    # Top-down grasp targeting the Lula right_gripper frame.
    # quat_obj = euler [0, 180, 0] deg = Ry(180deg) = [w=0, x=0, y=1, z=0].
    # With this orientation the local +Z axis (RMPflow approach axis) points
    # downward in world frame, so the pregrasp waypoint is above and the arm
    # descends to grasp.
    # position_obj z=0.05 places the right_gripper 5 cm above the cup rigid-
    # body origin (approximately mid-cup height after settling on the counter).
    # The x=y=0 centering keeps the contact symmetric about the cup axis, so
    # any yaw randomisation on the cup does not bias the approach.
    - name: top_down_grasp
      position_obj: [0.0, 0.0, 0.05]
      quat_obj: [0.0, 0.0, 1.0, 0.0]
      pregrasp_distance: 0.12
  functional_points:
    - name: cup_center
      position_obj: [0.0, 0.0, 0.0]
      quat_obj: [1.0, 0.0, 0.0, 0.0]

# Planner convergence tolerances - read by executor.py via cfg["planner"].
planner:
  max_move_steps: 600
  pos_tol: 0.02
  rot_tol: 0.1

motion:
  lift_height: 0.10
  preplace_distance: 0.06
  retreat_height: 0.08
  gripper_steps: 200

success:
  # xy_threshold: cup must land within 6 cm of sink_target XY.
  xy_threshold: 0.06
  # z offsets from sink_target_pose_world z=0.700.
  # z_min_offset=-0.03 -> floor at 0.670 m (in case the basin is slightly lower).
  # z_max_offset=0.20  -> ceiling at 0.900 m.
  #   The counter top is at 0.850 m; for a ~10 cm tall cup the rigid-body
  #   centre of mass rests at ~0.850+0.05=0.900 m when the cup sits on the
  #   counter with no basin recess.  If the basin has a 15 cm recess the cup
  #   settles near 0.700+0.05=0.750 m.  The 0.200 m window covers both cases
  #   without being absurdly wide.  Tighten once the real resting z is known.
  z_min_offset: -0.03
  z_max_offset: 0.20

dataset:
  output_dir: "datasets/cup_to_sink"
  # Record/capture cadence: a step is rendered+recorded every record_every
  # physics ticks (200 Hz). 8 -> ~25 Hz. Recording every physics tick buffers
  # 4x RGB-D per step in RAM and OOMs the container on long episodes.
  record_every: 8
  enabled_cameras: ["front", "left", "right", "wrist"]
  save_rgb: true
  save_depth: true
  image_width: 256
  image_height: 256
  depth_format: "uint16_mm"
  compression: "gzip"

cameras:
  front:
    prim_path: "/World/Cameras/front"
    position: [0.0, -1.5, 1.2]
    quat: [1.0, 0.0, 0.0, 0.0]
    width: 256
    height: 256
    fov: 60.0
    save_rgb: true
    save_depth: true
  left:
    prim_path: "/World/Cameras/left"
    position: [-1.2, 0.0, 1.1]
    quat: [1.0, 0.0, 0.0, 0.0]
    width: 256
    height: 256
    fov: 60.0
    save_rgb: true
    save_depth: true
  right:
    prim_path: "/World/Cameras/right"
    position: [1.2, 0.0, 1.1]
    quat: [1.0, 0.0, 0.0, 0.0]
    width: 256
    height: 256
    fov: 60.0
    save_rgb: true
    save_depth: true
  wrist:
    prim_path: "/World/Franka/panda_hand/wrist_camera"
    parent_prim_path: "/World/Franka/panda_hand"
    position: [0.0, 0.0, 0.05]
    quat: [1.0, 0.0, 0.0, 0.0]
    width: 256
    height: 256
    fov: 70.0
    save_rgb: true
    save_depth: true
