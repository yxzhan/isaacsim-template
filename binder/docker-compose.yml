version: '3'
services:
  isaacsim-template:
    image: isaacsim-template:main
    build:
      context: ../
      dockerfile: ./binder/Dockerfile
    # stdin_open: true
    # tty: true
    user: root
    # user: jovyan
    working_dir: /home/jovyan/work
    command: jupyter lab --allow-root --NotebookApp.token='' --no-browser --ip=0.0.0.0
    ports:
      - 8888:8888
    volumes:
      - ../:/home/jovyan/work:rw
      # - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /usr/share/vulkan/icd.d/:/etc/vulkan/icd.d
      - ${PWD}/isaacsim-cache/cache/kit:/isaac-sim/kit/cache
      # - ${PWD}/isaacsim-cache/cache/ov:/root/.cache/ov:rw
      # - ${PWD}/isaacsim-cache/cache/pip:/root/.cache/pip:rw
      # - ${PWD}/isaacsim-cache/cache/glcache:/root/.cache/nvidia/GLCache:rw
      # - ${PWD}/isaacsim-cache/cache/computecache:/root/.nv/ComputeCache:rw
      # - ${PWD}/isaacsim-cache/logs:/root/.nvidia-omniverse/logs:rw
      # - ${PWD}/isaacsim-cache/data:/root/.local/share/ov/data:rw
      # - ${PWD}/isaacsim-cache/documents:/root/Documents:rw
    environment:
      # - DISPLAY
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ACCEPT_EULA="YES"
      - PRIVACY_CONSENT="YES"
      - OMNI_KIT_ACCEPT_EULA="YES"
      - OMNI_KIT_ALLOW_ROOT=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]